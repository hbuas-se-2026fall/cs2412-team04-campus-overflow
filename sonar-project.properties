# SonarQube / SonarCloud 扫描配置（Lab 7 Step 3「质量门禁与 SonarQube 接入」）
#
# 用法：
#   1) 起 SonarQube（本机或团队 Docker）：
#      docker run -d --name sonarqube -p 9000:9000 sonarqube:lts-community
#      默认 http://localhost:9000 ，首次登录 admin/admin（会要求改密）
#   2) 生成 token：My Account → Security → Generate Tokens
#   3) 先跑一遍测试生成 jacoco.xml：
#      cd backend && mvn -B clean verify -DskipITs -Djacoco.skip=false
#   4) 推送报告：
#      mvn -B -f backend/pom.xml sonar:sonar \
#        -Dsonar.host.url=http://localhost:9000 \
#        -Dsonar.token=<你的token>
#   5) 在 SonarQube 的 Quality Gates 里配置门禁：Coverage > 70%、Bugs = 0、Vulnerabilities = 0

sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.projectVersion=1.0.0

# 源码范围：后端 27 个 Maven 模块 + 前端 src
sonar.sources=backend,frontend/src
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/*.tsbuildinfo,\
  docs/**,deploy/**,scripts/**

# 测试代码（后端 JUnit、前端由 ESLint/TS 覆盖，不送 Sonar 测试分析）
sonar.tests=backend
sonar.test.inclusions=**/src/test/**/*.java
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes

# JaCoCo 报告（jacoco-maven-plugin 的 report goal 在 verify 阶段产出）
sonar.coverage.jacoco.xmlReportPaths=backend/**/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=\
  **/co-bootstrap/**,\
  **/*Application.java,\
  **/*Config.java,\
  **/dto/**,\
  **/api/**/*Event.java

# TypeScript/JS
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=

# 编码与规则
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.qualitygate.wait=true
