# 一键启动完整环境：docker compose -f deploy/docker-compose.yml --profile observability up -d --build
# 仅启动应用（不含监控）：docker compose -f deploy/docker-compose.yml up -d --build
name: campus-overflow

services:
  mysql:
    image: mysql:8.0.39
    container_name: co-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram-token-size=2               # 中文全文检索（ADR-005）
      - --innodb-ft-enable-stopword=0      # 避免 ngram 词元因包含停用词被丢弃
      - --default-time-zone=+00:00         # 全库统一 UTC
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: campus_overflow
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: co-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: co-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-prod}   # 生产只启用 prod；本地开发用 docker-compose.dev.yml
      DB_HOST: mysql
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_HOST: redis
      CO_FIELD_KEY: ${CO_FIELD_KEY:?CO_FIELD_KEY required}
      CO_FIELD_MAC_KEY: ${CO_FIELD_MAC_KEY:?CO_FIELD_MAC_KEY required}
      # HTTP 部署必须 false：Secure Cookie 在 http:// 下浏览器不会回传，登录后会立刻丢会话。
      # 只有 Nginx 启用 TLS、全程 https:// 访问时才设为 true（见 README「生产部署」）。
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TZ: UTC
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    # 生产不把后端 8080 映射到 host：所有流量必须经 Nginx（同源 /api/、/actuator/health）。
    # 直出 8080 会绕过 Nginx 的 client_max_body_size 与 actuator 端点白名单。
    # 诊断请在容器内执行：docker compose -f deploy/docker-compose.yml exec backend wget -qO- http://localhost:8080/actuator/health
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: co-web
    depends_on:
      backend: { condition: service_started }
    ports: ["80:80"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: co-prometheus
    profiles: ["observability"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: co-grafana
    profiles: ["observability"]
    environment:
      # 审计 2-3a：不用 ${GRAFANA_PASSWORD:?} —— compose 会对整份文件做插值，
      # 即使没启用 observability profile 也会因缺变量而直接失败。
      # 改为容器内启动前自检：启用监控但没配密码时，Grafana 自己报错退出。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_PASSWORD 未设置：启用 --profile observability 时必须在 deploy/.env 中填写" >&2
          exit 1
        fi
        exec /run.sh
    depends_on: [prometheus]
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mysql-data:
  redis-data:
  grafana-data:
