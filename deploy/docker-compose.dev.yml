# 本地开发环境：带默认密码、端口映射与 demo 数据，仅限本机使用。
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d --build
# 生产请使用 deploy/docker-compose.yml（无默认密钥、无 demo、不暴露 MySQL/Redis 端口）。
name: campus-overflow-dev

services:
  mysql:
    image: mysql:8.0.39
    container_name: co-mysql-dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram-token-size=2
      - --innodb-ft-enable-stopword=0
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pwd}
      MYSQL_DATABASE: campus_overflow
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus_dev_pwd}
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_dev_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: co-redis-dev
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: co-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev,demo
      DB_HOST: mysql
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD:-campus_dev_pwd}
      REDIS_HOST: redis
      CO_FIELD_KEY: ${CO_FIELD_KEY:-GB7LwwDgcWpslCMsYtIkTbDrzER+IbjJwhtSu7LPz1I=}
      CO_FIELD_MAC_KEY: ${CO_FIELD_MAC_KEY:-ZGV2LW1hYy1rZXktMzItYnl0ZXMtZm9yLWRldi1vayE=}
      COOKIE_SECURE: "false"
      TZ: UTC
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: co-web-dev
    depends_on:
      backend: { condition: service_started }
    ports: ["80:80"]

volumes:
  mysql-data:
  redis-data:
