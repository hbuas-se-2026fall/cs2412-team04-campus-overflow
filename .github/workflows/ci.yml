# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
name: CI
on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

# V3 §8.5 控制 Actions 用量：同一分支的新提交取消旧运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（全量）
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test

      # 阶段 3：架构适应度函数
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      # 阶段 4：覆盖率门禁（全量）
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false

      # 阶段 5：全量集成测试（V3 §8.3：S3/S4 起硬门禁，不再容错）
      # -Dtest=none 让 surefire 不重复跑单测（阶段 2 已跑），只由 failsafe 执行 *IT
      # DOCKER_HOST 显式指向 runner 的 docker socket，避免 Testcontainers 探测失败
      - name: 集成测试
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          # runner 的 Docker daemon 要求 API ≥1.40，而 docker-java 默认 1.32，需显式指定
          DOCKER_API_VERSION: "1.43"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn -B -f backend/pom.xml verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false

      # 阶段 6：SonarQube 扫描（Lab 7 Step 3）
      # 未配置 SONAR_TOKEN 时跳过，不阻塞 PR；配置后自动启用且 qualitygate.wait=true 会等待门禁结果
      - name: SonarQube 扫描
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn -B -f backend/pom.xml sonar:sonar             -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}"             -Dsonar.token="${SONAR_TOKEN}"

      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: "backend/**/target/site/jacoco/**"
          if-no-files-found: ignore

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund   # BUILD-01：与 Dockerfile 统一用 npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier 格式检查
        working-directory: frontend
        run: npm run format:check
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 单元测试（组件）
        working-directory: frontend
        run: npm run test:run
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [backend, frontend]
    # V3 §8.5：只在 main 的 push（发布）与目标为 main 的 PR 上构建镜像；
    # 同时保证 main 的必需检查「容器镜像构建」总能被满足（PR→main 会触发）
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .

      - name: 登录 GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像到 GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          BACKEND=ghcr.io/hbuas-se-2026fall/cs2412-team04-campus-overflow/backend
          WEB=ghcr.io/hbuas-se-2026fall/cs2412-team04-campus-overflow/web
          docker tag campus-overflow-backend:${{ github.sha }} $BACKEND:${GITHUB_SHA}
          docker tag campus-overflow-backend:${{ github.sha }} $BACKEND:latest
          docker tag campus-overflow-web:${{ github.sha }} $WEB:${GITHUB_SHA}
          docker tag campus-overflow-web:${{ github.sha }} $WEB:latest
          docker push $BACKEND:${GITHUB_SHA}
          docker push $BACKEND:latest
          docker push $WEB:${GITHUB_SHA}
          docker push $WEB:latest
