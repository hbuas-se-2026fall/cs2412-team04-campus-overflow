# SonarQube 扫描配置（Maven 从此目录读取；根目录那份给人看与 CI 文档用）
# 说明：Maven 的 sonar 插件从「被构建 POM 所在目录」加载 sonar-project.properties，
#      因此执行 `mvn -f backend/pom.xml sonar:sonar` 时必须把配置放在 backend/ 下。

sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.projectVersion=1.0.0

# 源码：Maven 自动按模块识别 Java；额外纳入前端源码
sonar.sources=.
sonar.inclusions=**/*.java
sonar.exclusions=  **/target/**,  **/src/test/**

# 测试代码
sonar.tests=.
sonar.test.inclusions=**/src/test/**/*.java

# JaCoCo（相对 projectBaseDir=backend/）
sonar.coverage.jacoco.xmlReportPaths=co-bootstrap/target/site/jacoco/jacoco.xml,co-discovery/co-discovery-application/target/site/jacoco/jacoco.xml,co-discovery/co-discovery-domain/target/site/jacoco/jacoco.xml,co-identity/co-identity-application/target/site/jacoco/jacoco.xml,co-identity/co-identity-domain/target/site/jacoco/jacoco.xml,co-qa/co-qa-api/target/site/jacoco/jacoco.xml,co-qa/co-qa-application/target/site/jacoco/jacoco.xml,co-qa/co-qa-domain/target/site/jacoco/jacoco.xml,co-reputation/co-reputation-application/target/site/jacoco/jacoco.xml,co-reputation/co-reputation-domain/target/site/jacoco/jacoco.xml,co-shared-kernel/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=  **/co-bootstrap/**,  **/*Application.java,  **/*Config.java,  **/dto/**,  **/api/**/*Event.java

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
